name: Production Diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_PORT: ${{ secrets.DO_PORT }}
      DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
      APP_DIR: ${{ vars.DO_APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Read runtime and database health
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > "$HOME/.ssh/digitalocean_deploy"
          chmod 600 "$HOME/.ssh/digitalocean_deploy"
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command 'node - %q' "${APP_DIR:-/var/www/CRMANANTTATTVA}"
          ssh -i "$HOME/.ssh/digitalocean_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "${DO_PORT:-22}" "$DO_USER@$DO_HOST" "$remote_command" < scripts/diagnose-production.cjs
