name: Vercel Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel environment to deploy
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy CRM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
      VERCEL_CLI_VERSION: 54.17.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run backend tests
        run: npm test --prefix backend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Verify Vercel secrets
        shell: bash
        run: |
          for secret_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is not configured"
              exit 1
            fi
          done

      - name: Pull Vercel project settings
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=${DEPLOY_ENV} --token=${VERCEL_TOKEN}

      - name: Build Vercel output
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build ${{ env.DEPLOY_ENV == 'production' && '--prod' || '' }} --token=${VERCEL_TOKEN}

      - name: Deploy prebuilt output
        id: deploy
        shell: bash
        run: |
          deploy_args=(--prebuilt --token="${VERCEL_TOKEN}")
          if [ "${DEPLOY_ENV}" = "production" ]; then
            deploy_args+=(--prod)
          fi
          deployment_url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy "${deploy_args[@]}")"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "### Vercel deployment"
            echo ""
            echo "- Environment: \`${DEPLOY_ENV}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
